apiVersion: v1
kind: Service
metadata:
  name: orders-ms
spec:
  selector:
    app.kubernetes.io/name: orders-ms
  ports:
    - name: http
      port: 4003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-ms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-ms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-ms
    spec:
      serviceAccountName: orders-ms
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: orders-ms
              topologyKey: kubernetes.io/hostname
      containers:
        - name: orders-ms
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/jeremy142oo4/sa-orders-ms:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4003
          envFrom:
            - secretRef:
                name: orders-ms-secrets
          env:
            - name: PORT
              value: "4003"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
