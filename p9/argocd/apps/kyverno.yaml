apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      values: |
        admissionController:
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
        backgroundController:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        cleanupController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        reportsController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: clusterpolicies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /spec
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /spec
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: mutatingpolicies.policies.kyverno.io
      jsonPointers:
        - /metadata/annotations
        - /spec
