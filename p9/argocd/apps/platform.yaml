apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Jeremy142OO4/Practicas-SA-B-202300644-gitops.git
    targetRevision: main
    path: p9/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p9
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

