apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-reader
  namespace: sa-p8
  labels:
    app.kubernetes.io/part-of: practica-8
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-reader
  namespace: sa-p8
  labels:
    app.kubernetes.io/part-of: practica-8
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-reader

---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: sa-p7-kubernetes
  labels:
    app.kubernetes.io/part-of: practica-8
spec:
  provider:
    kubernetes:
      remoteNamespace: sa-p8
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
