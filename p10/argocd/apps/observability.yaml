apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Jeremy142OO4/Practicas-SA-B-202300644-gitops.git
    targetRevision: main
    path: p10/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
