apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: practica-10
spec:
  project: default
  source:
    repoURL: https://github.com/Jeremy142OO4/Practicas-SA-B-202300644-gitops.git
    targetRevision: main
    path: p10/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
