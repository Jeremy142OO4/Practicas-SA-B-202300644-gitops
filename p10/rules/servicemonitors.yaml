# Un target por pod, aunque stable y canary apunten al mismo gateway.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: p10-api-gateway
  namespace: observability
  labels:
    release: p10-monitoring
spec:
  namespaceSelector:
    matchNames: [sa-p9]
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  podMetricsEndpoints:
    - port: http
      honorLabels: true
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: p10-orders
  namespace: observability
  labels:
    release: p10-monitoring
spec:
