apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: p10-api-gateway-canary
  namespace: observability
  labels:
    release: p10-monitoring
spec:
  namespaceSelector:
    matchNames: [sa-p9]
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      rollout-track: canary
  endpoints:
    - port: http
      honorLabels: true
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_label_rollout_track]
          targetLabel: rollout_track
---
