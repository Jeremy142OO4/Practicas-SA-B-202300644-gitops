apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: p10-slos
  namespace: observability
  labels:
    release: p10-monitoring
    app.kubernetes.io/part-of: practica-10
spec:
  groups:
    - name: p10.slo.recording
      interval: 15s
      rules:
        - record: slo:api_availability:ratio
          expr: |
            sum(increase(http_server_requests_total{service="api-gateway",route!~"/health|/metrics",status!~"5.."}[1h])) / sum(increase(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[1h]))
        - record: slo:api_latency:ratio
          expr: |
            sum(increase(http_server_request_duration_seconds_bucket{service="api-gateway",route!~"/health|/metrics",le="0.5"}[1h])) / sum(increase(http_server_request_duration_seconds_count{service="api-gateway",route!~"/health|/metrics"}[1h]))
        - record: slo:api_availability:error_budget:ratio
          expr: |
            clamp_min((1 - slo:api_availability:ratio) / 0.01, 0)
        - record: slo:api_latency:error_budget:ratio
          expr: |
            clamp_min((1 - slo:api_latency:ratio) / 0.05, 0)
        - record: slo:api_availability:burn_rate_1m
          expr: |
            (sum(rate(http_server_requests_total{service="api-gateway",route!~"/health|/metrics",status=~"5.."}[1m])) or (sum(rate(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[1m])) * 0)) / clamp_min(sum(rate(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[1m])), 0.000001) / 0.01
        - record: slo:api_latency:burn_rate_1m
          expr: |
            clamp_min(1 - sum(rate(http_server_request_duration_seconds_bucket{service="api-gateway",route!~"/health|/metrics",le="0.5"}[1m])) / sum(rate(http_server_request_duration_seconds_count{service="api-gateway",route!~"/health|/metrics"}[1m])), 0) / 0.05
        - record: slo:api_availability:burn_rate_5m
          expr: |
            (sum(rate(http_server_requests_total{service="api-gateway",route!~"/health|/metrics",status=~"5.."}[5m])) or (sum(rate(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[5m])) * 0)) / clamp_min(sum(rate(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[5m])), 0.000001) / 0.01
        - record: slo:api_latency:burn_rate_5m
          expr: |
            clamp_min(1 - sum(rate(http_server_request_duration_seconds_bucket{service="api-gateway",route!~"/health|/metrics",le="0.5"}[5m])) / sum(rate(http_server_request_duration_seconds_count{service="api-gateway",route!~"/health|/metrics"}[5m])), 0) / 0.05
        - record: slo:canary_latency:burn_rate_1m
          expr: |
            clamp_min(1 - sum by (pod) (rate(http_server_request_duration_seconds_bucket{service="api-gateway",rollout_track="canary",route!~"/health|/metrics",le="0.5"}[1m])) / sum by (pod) (rate(http_server_request_duration_seconds_count{service="api-gateway",rollout_track="canary",route!~"/health|/metrics"}[1m])), 0) / 0.05
        - record: slo:canary_latency:burn_rate_5m
          expr: |
            clamp_min(1 - sum by (pod) (rate(http_server_request_duration_seconds_bucket{service="api-gateway",rollout_track="canary",route!~"/health|/metrics",le="0.5"}[5m])) / sum by (pod) (rate(http_server_request_duration_seconds_count{service="api-gateway",rollout_track="canary",route!~"/health|/metrics"}[5m])), 0) / 0.05
    - name: p10.slo.alerts
      interval: 15s
      # Se evalua tambien la cohorte candidata: stable no debe ocultar su falla.
      rules:
        - alert: ApiAvailabilityErrorBudgetBurn
          expr: |
            (slo:api_availability:burn_rate_1m > 2)
            and (slo:api_availability:burn_rate_5m > 2)
            and (sum(increase(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[5m])) >= 2)
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "Consumo acelerado del presupuesto de disponibilidad"
            description: "El consumo supera 2 veces el ritmo permitido en ventanas de 1 y 5 minutos. Revisar la candidata y seguir el runbook."
            runbook_url: https://github.com/Jeremy142OO4/Practicas-SA-B-202300644-gitops/blob/main/p10/docs/RUNBOOK.md#disponibilidad
        - alert: ApiLatencyErrorBudgetBurn
          expr: |
            (slo:api_latency:burn_rate_1m > 2)
            and (slo:api_latency:burn_rate_5m > 2)
            and (sum(increase(http_server_requests_total{service="api-gateway",route!~"/health|/metrics"}[5m])) >= 2)
            or
            ((slo:canary_latency:burn_rate_1m > 2)
            and (slo:canary_latency:burn_rate_5m > 2)
            and (sum by (pod) (increase(http_server_requests_total{service="api-gateway",rollout_track="canary",route!~"/health|/metrics"}[5m])) >= 2))
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "Consumo acelerado del presupuesto de latencia"
            description: "El consumo supera 2 veces el ritmo permitido en ventanas de 1 y 5 minutos. Revisar la candidata y seguir el runbook."
            runbook_url: https://github.com/Jeremy142OO4/Practicas-SA-B-202300644-gitops/blob/main/p10/docs/RUNBOOK.md#latencia

