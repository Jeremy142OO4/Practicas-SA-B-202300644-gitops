apiVersion: v1
kind: ConfigMap
metadata:
  name: p10-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  sa-platform.json: |
    {
      "title": "SA Platform - P10",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "tags": ["p10", "observability", "slo"],
      "templating": {"list": []},
      "panels": [
        {"type":"stat","title":"Disponibilidad API","gridPos":{"h":4,"w":6,"x":0,"y":0},"targets":[{"expr":"slo:api_availability:ratio","refId":"A"}]},
        {"type":"stat","title":"Latencia p95","gridPos":{"h":4,"w":6,"x":6,"y":0},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service=\"api-gateway\"}[5m])))","refId":"A"}]},
        {"type":"timeseries","title":"Trafico y errores","gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"expr":"sum by (service) (rate(http_server_requests_total[5m]))","legendFormat":"{{service}} solicitudes","refId":"A"},{"expr":"sum by (service) (rate(http_server_requests_total{status=~\"5..\"}[5m]))","legendFormat":"{{service}} errores","refId":"B"}]},
        {"type":"timeseries","title":"Saturacion CPU","gridPos":{"h":8,"w":12,"x":0,"y":12},"targets":[{"expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"sa-p9\",container!=\"\"}[5m]))","legendFormat":"{{pod}}","refId":"A"}]},
        {"type":"timeseries","title":"Eventos de negocio","gridPos":{"h":8,"w":12,"x":0,"y":20},"targets":[{"expr":"sum by (event, status) (rate(business_events_total[5m]))","legendFormat":"{{event}} {{status}}","refId":"A"}]}
      ]
    }
