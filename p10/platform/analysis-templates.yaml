apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-metrics
  namespace: sa-p9
spec:
  args:
    - name: podHash
  metrics:
    - name: canary-error-rate
      initialDelay: 45s
      interval: 15s
      count: 3
      failureLimit: 0
      successCondition: len(result) == 1 && !isNaN(result[0]) && result[0] < 0.05
      provider:
        prometheus:
          address: http://p10-monitoring-kube-promet-prometheus.observability.svc.cluster.local:9090
          query: |
            (sum(rate(http_server_requests_total{service="api-gateway",rollout_track="canary",pod=~"api-gateway-{{args.podHash}}-.*",route!~"/health|/metrics",status=~"5.."}[1m]))
            or (sum(rate(http_server_requests_total{service="api-gateway",rollout_track="canary",pod=~"api-gateway-{{args.podHash}}-.*",route!~"/health|/metrics"}[1m])) * 0))
            /
            sum(rate(http_server_requests_total{service="api-gateway",rollout_track="canary",pod=~"api-gateway-{{args.podHash}}-.*",route!~"/health|/metrics"}[1m]))
    - name: canary-p95-latency
      initialDelay: 45s
      interval: 15s
      count: 3
      failureLimit: 0
      successCondition: len(result) == 1 && !isNaN(result[0]) && result[0] < 0.5
      provider:
        prometheus:
          address: http://p10-monitoring-kube-promet-prometheus.observability.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_request_duration_seconds_bucket{service="api-gateway",rollout_track="canary",pod=~"api-gateway-{{args.podHash}}-.*",route!~"/health|/metrics"}[1m])))
