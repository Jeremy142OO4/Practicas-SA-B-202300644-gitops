apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-metrics
  namespace: sa-p9
spec:
  args:
    - name: canaryService
      value: api-gateway-canary
  metrics:
    - name: canary-error-rate
      interval: 30s
      count: 2
      failureLimit: 1
      successCondition: result[0] < 0.05
      provider:
        prometheus:
          address: http://p10-monitoring-kube-promet-prometheus.observability.svc.cluster.local:9090
          query: |
            sum(rate(http_server_requests_total{service="api-gateway",rollout_track="canary",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_total{service="api-gateway",rollout_track="canary"}[5m])), 0.000001)
            or vector(0)
    - name: canary-p95-latency
      interval: 30s
      count: 2
      failureLimit: 1
      successCondition: result[0] < 0.5
      provider:
        prometheus:
          address: http://p10-monitoring-kube-promet-prometheus.observability.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_server_request_duration_seconds_bucket{service="api-gateway",rollout_track="canary"}[5m])))
            or vector(0)
