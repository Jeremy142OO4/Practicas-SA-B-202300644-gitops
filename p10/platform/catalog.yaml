apiVersion: v1
kind: Service
metadata:
  name: catalog-ms
  namespace: sa-p9
  labels:
    app.kubernetes.io/name: catalog-ms
spec:
  selector:
    app.kubernetes.io/name: catalog-ms
  ports:
    - name: http
      port: 4002
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-ms
  namespace: sa-p9
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-ms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-ms
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-ms
          image: ghcr.io/jeremy142oo4/sa-catalog-ms:p10-v1.0.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-ms-secrets
                  key: DATABASE_URL
            - name: PORT
              value: "4002"
          ports:
            - name: http
              containerPort: 4002
          readinessProbe:
            httpGet: {path: /health, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
