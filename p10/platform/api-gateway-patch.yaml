apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-gateway
  namespace: sa-p9
spec:
  strategy:
    canary:
      steps:
        - setWeight: 10
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: api-gateway-metrics
        - setWeight: 30
        - analysis:
            templates:
              - templateName: api-gateway-metrics
        - setWeight: 60
        - analysis:
            templates:
              - templateName: api-gateway-metrics
        - pause: {duration: 2m}
  template:
    metadata:
      annotations:
        p10.observability/enabled: "true"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/jeremy142oo4/sa-api-gateway:p10-v1.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef: {name: api-gateway-config}
            - secretRef: {name: api-gateway-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 30
            timeoutSeconds: 3
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
