apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require CPU and memory limits
    policies.kyverno.io/category: Resource Management
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-memory
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Cada contenedor debe declarar requests y limits de CPU y memoria.
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"

