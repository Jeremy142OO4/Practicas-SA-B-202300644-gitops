apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-smoke
  namespace: sa-p8
spec:
  args:
    - name: serviceName
      value: api-gateway-canary
  metrics:
    - name: smoke
      count: 3
      interval: 20s
      failureLimit: 1
      successCondition: result[0] == 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: rollout-analysis
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: curl
                    image: curlimages/curl:8.10.1
                    command: [sh, -c]
                    args:
                      - curl --fail --silent --show-error "http://{{args.serviceName}}:4000/health"
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 50m
                        memory: 32Mi

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-integration
  namespace: sa-p8
spec:
  args:
    - name: serviceName
      value: api-gateway-canary
  metrics:
    - name: integration
      count: 2
      interval: 30s
      failureLimit: 1
      successCondition: result[0] == 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: rollout-analysis
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: integration
                    image: curlimages/curl:8.10.1
                    command: [sh, -c]
                    args:
                      - >-
                        curl --fail --silent --show-error
                        "http://{{args.serviceName}}:4000/health" &&
                        curl --fail --silent --show-error
                        -H 'Content-Type: application/json'
                        -d '{"query":"{__typename}"}'
                        "http://{{args.serviceName}}:4000/catalog/graphql" |
                        grep -q '"data"'
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 50m
                        memory: 32Mi

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-load
  namespace: sa-p8
spec:
  args:
    - name: serviceName
      value: api-gateway-canary
  metrics:
    - name: load
      count: 1
      failureLimit: 0
      successCondition: result[0] == 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: rollout-analysis
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: load
                    image: grafana/k6:0.55.2
                    command: [sh, -c]
                    args:
                      - |
                        cat >/tmp/load.js <<'EOF'
                        import http from 'k6/http';
                        import { check } from 'k6';
                        export default function () {
                          const response = http.get(`${__ENV.BASE_URL}/health`);
                          check(response, { 'health responds': (r) => r.status === 200 });
                        }
                        EOF
                        k6 run --vus 2 --duration 20s \
                          --thresholds 'http_req_failed<0.05' \
                          --thresholds 'http_req_duration{p(95)}<500' \
                          -e BASE_URL=http://{{args.serviceName}}:4000 /tmp/load.js
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        cpu: 250m
                        memory: 128Mi
