apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: api-gateway-integration
  namespace: sa-p8
spec:
  args:
    - name: serviceName
      value: api-gateway-canary
  metrics:
    - name: integration
      count: 2
      interval: 30s
      failureLimit: 1
      successCondition: result[0] == 0
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: rollout-analysis
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: integration
                    image: curlimages/curl:8.10.1
                    command: [sh, -c]
                    args:
                      - >-
                        curl --fail --silent --show-error
                        "http://{{args.serviceName}}:4000/health" &&
                        curl --fail --silent --show-error
                        -H 'Content-Type: application/json'
                        -d '{"query":"{__typename}"}'
                        "http://{{args.serviceName}}:4000/catalog/graphql" |
                        grep -q '"data"'
                    securityContext:
                      runAsNonRoot: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: [ALL]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 50m
                        memory: 32Mi
