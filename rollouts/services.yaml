apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  namespace: sa-p8
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: sa-platform
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 4000
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  namespace: sa-p8
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: sa-platform
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 4000
      targetPort: http
